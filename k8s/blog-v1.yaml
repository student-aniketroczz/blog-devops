apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-v1
  labels:
    app: blog
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
      version: v1
  template:
    metadata:
      labels:
        app: blog
        version: v1
    spec:
      containers:
        - name: blog
          image: YOUR_DOCKERHUB_USERNAME/blog-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: blog-v1-service
spec:
  type: LoadBalancer
  selector:
    app: blog
    version: v1
  ports:
    - port: 8081
      targetPort: 5000
