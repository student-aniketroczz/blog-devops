apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-v3
  labels:
    app: blog
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
      version: v3
  template:
    metadata:
      labels:
        app: blog
        version: v3
    spec:
      containers:
        - name: blog
          image: YOUR_DOCKERHUB_USERNAME/blog-app:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: blog-v3-service
spec:
  type: LoadBalancer
  selector:
    app: blog
    version: v3
  ports:
    - port: 8083
      targetPort: 5000
